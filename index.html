<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>极简云</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f5f6fa;--card-bg:#fff;--text:#222;--text2:#999;--border:#eee;
      --chip-bg:#fff;--chip-border:#ddd;--chip-active-bg:#4e6ef2;--chip-active-text:#fff;
      --input-bg:#f5f6fa;--shadow:0 4px 20px rgba(0,0,0,.06);
    }
    body.dark{
      --bg:#1a1a2e;--card-bg:#16213e;--text:#eee;--text2:#aaa;--border:#2a2a4a;
      --chip-bg:#16213e;--chip-border:#2a2a4a;--input-bg:#0f0f23;
      --shadow:0 4px 20px rgba(0,0,0,.3);
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);height:100vh;overflow:hidden;color:var(--text);
      transition:background .3s;animation: bodyFadeIn .5s ease;
    }
    @keyframes bodyFadeIn { from{opacity:0} to{opacity:1} }
    .page{display:none;height:100vh;overflow-y:auto;padding-bottom:70px}
    .page.active{display:block}
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card-bg);
      display:none;border-top:1px solid var(--border);z-index:100;transition:background .3s;
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:11px;color:var(--text2);cursor:pointer;transition:color .2s, transform .2s;
    }
    .nav-item.active{color:#4e6ef2;transform:scale(1.05)}
    .nav-item .nav-icon{width:24px;height:24px;margin-bottom:2px}
    .btn-primary{
      background:#4e6ef2;color:#fff;border:none;border-radius:8px;padding:10px 20px;
      font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(78,110,242,.3);
    }
    .fab{
      position:fixed;right:20px;bottom:80px;width:50px;height:50px;border-radius:50%;
      background:#4e6ef2;color:#fff;border:none;font-size:24px;
      box-shadow:0 4px 12px rgba(78,110,242,.4);z-index:99;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    input{
      width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;
      font-size:14px;outline:none;background:var(--input-bg);color:var(--text);
    }
    input:focus{border-color:#4e6ef2;box-shadow:0 0 0 3px rgba(78,110,242,.1)}
    .card{
      background:var(--card-bg);border-radius:12px;padding:16px;margin:12px 16px;
      box-shadow:var(--shadow);
    }
    .file-row{
      display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);
    }
    .file-icon{
      width:40px;height:40px;margin-right:12px;display:flex;align-items:center;
      justify-content:center;background:#f0f2ff;border-radius:8px;
    }
    .file-info{flex:1;min-width:0}
    .file-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-meta{font-size:12px;color:var(--text2);margin-top:2px}
    .chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;white-space:nowrap}
    .chip{
      padding:6px 14px;border-radius:16px;font-size:13px;background:var(--chip-bg);
      border:1px solid var(--chip-border);cursor:pointer;color:var(--text);
    }
    .chip.active{background:#4e6ef2;color:#fff;border-color:#4e6ef2}
    .progress-bar{height:6px;background:rgba(0,0,0,.1);border-radius:3px;margin:8px 0;overflow:hidden}
    .progress-fill{height:100%;background:#4e6ef2;border-radius:3px}
    .splash{
      position:fixed;top:0;left:0;right:0;bottom:0;background:#4e6ef2;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:9999;animation: splashFadeIn 1s ease;
    }
    @keyframes splashFadeIn { from{opacity:0} to{opacity:1} }
    .splash h1{color:#fff;font-size:28px;margin-bottom:8px;font-weight:300}
    .splash p{color:rgba(255,255,255,.8);font-size:14px}
    .skip-btn{
      position:fixed;top:20px;right:20px;background:rgba(255,255,255,.2);
      color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 14px;
      border-radius:16px;font-size:13px;z-index:10000;cursor:pointer;
    }
    .svg-icon{width:20px;height:20px;display:inline-block;vertical-align:middle}
    .back-btn{display:flex;align-items:center;gap:6px;color:#4e6ef2;cursor:pointer;margin-bottom:16px;font-size:14px}
    .toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;
      color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;
      opacity:0;transition:opacity .3s;
    }
    .toast.show{opacity:1}
    .auth-container{
      display:flex;align-items:center;justify-content:center;height:100vh;
    }
    .auth-card{
      background:var(--card-bg);padding:32px 24px;border-radius:16px;
      box-shadow:var(--shadow);width:90%;max-width:360px;
    }
    .auth-card h2{font-size:22px;font-weight:500;margin-bottom:4px}
    .auth-card .sub{color:var(--text2);margin-bottom:20px;font-size:14px}
    .auth-card input{margin-bottom:12px}
    .auth-toggle{text-align:center;margin-top:12px;font-size:14px;color:var(--text2)}
    .auth-toggle span{color:#4e6ef2;cursor:pointer}
  </style>
</head>
<body>

<div class="splash" id="splash"><h1>极简云</h1><p>分享 / 储存 / 下载</p></div>
<span class="skip-btn" id="skip-btn">5s 跳过</span>

<div id="auth-page" style="display:none">
  <div class="auth-container">
    <div class="auth-card">
      <h2 id="auth-title">登录</h2>
      <p class="sub" id="auth-sub">欢迎回来</p>
      <input type="email" id="auth-email" placeholder="邮箱" autocomplete="email">
      <input type="password" id="auth-password" placeholder="密码">
      <button class="btn-primary" id="auth-btn">登录</button>
      <div class="auth-toggle">
        <span id="toggle-text">没有账号？</span>
        <span id="toggle-link" style="color:#4e6ef2;cursor:pointer">注册</span>
      </div>
    </div>
  </div>
</div>

<div id="main-container" style="display:none">
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-files"></div>
  <div class="page" id="page-me"></div>
  <div class="page" id="page-settings"></div>
  <div class="page" id="page-feedback"></div>
  <div class="page" id="page-shareHistory"></div>
  <div class="page" id="page-trash"></div>
  <div class="page" id="page-dynamic"></div>
</div>

<div id="share-page" style="display:none">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div class="card" style="width:90%;max-width:400px;text-align:center">
      <h2>你收到了一个文件</h2>
      <div id="share-content"></div>
    </div>
  </div>
</div>

<div id="pwd-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--card-bg);border-radius:12px;padding:24px;width:300px">
    <h3 style="margin-bottom:16px">修改密码</h3>
    <input type="password" id="old-password" placeholder="旧密码">
    <input type="password" id="new-password1" placeholder="新密码">
    <input type="password" id="new-password2" placeholder="确认新密码">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn-primary" style="background:#eee;color:#333" onclick="closePwdModal()">取消</button>
      <button class="btn-primary" onclick="changePassword()">确认</button>
    </div>
  </div>
</div>

<div class="upload-panel" id="upload-panel">
  <div class="upload-panel-header">
    <span>上传进度</span>
    <span style="cursor:pointer;font-size:20px" id="close-upload-panel">×</span>
  </div>
  <div class="upload-panel-body" id="upload-task-list"></div>
</div>
<div class="overlay" id="overlay"></div>

<div class="bottom-nav" id="bottom-nav">
  <div class="nav-item active" data-tab="home">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </div>
  <div class="nav-item" data-tab="files">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    文件
  </div>
  <div class="nav-item" data-tab="me">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    我的
  </div>
</div>

<input type="file" id="hidden-upload" multiple style="display:none">
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://plwljusbfqkvlhpclvsv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsd2xqdXNiZnFrdmxocGNsdnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzk1MTUsImV4cCI6MjEwMTg1NTUxNX0.BDVqL87UWewkYt1j-z8O3Am_3tML954F4Pyi71T_Rd0')

let allFiles = [], currentFilter = 'all', currentTab = 'home', currentUser = null, uploadTasks = [], isLogin = true
const shareCode = new URLSearchParams(location.search).get('code')

const splash = document.getElementById('splash')
const skipBtn = document.getElementById('skip-btn')
let countdown = 5
let splashTimer = null

function startSplash() {
  skipBtn.textContent = countdown + 's 跳过'
  splashTimer = setInterval(() => {
    countdown--
    if (countdown <= 0) { clearInterval(splashTimer); hideSplash() }
    else skipBtn.textContent = countdown + 's 跳过'
  }, 1000)
}

function hideSplash() {
  splash.style.transition = 'opacity 0.5s'
  splash.style.opacity = '0'
  setTimeout(() => {
    splash.style.display = 'none'
    skipBtn.style.display = 'none'
    if (shareCode) showSharePage()
    else checkAuth()
  }, 500)
}

skipBtn.addEventListener('click', () => { clearInterval(splashTimer); hideSplash() })
startSplash()

function showSharePage() {
  document.getElementById('share-page').style.display = 'block'
  loadShare(shareCode)
}

function showAuthPage() {
  document.getElementById('auth-page').style.display = 'block'
  document.getElementById('main-container').style.display = 'none'
  document.getElementById('bottom-nav').style.display = 'none'
}

function showMainPages() {
  document.getElementById('auth-page').style.display = 'none'
  document.getElementById('main-container').style.display = 'block'
  document.getElementById('bottom-nav').style.display = 'flex'
  switchTab('home')
  loadFiles()
  loadHomeData()
}

document.getElementById('toggle-link').addEventListener('click', () => {
  isLogin = !isLogin
  document.getElementById('auth-title').textContent = isLogin ? '登录' : '注册'
  document.getElementById('auth-sub').textContent = isLogin ? '欢迎回来' : '创建新账号'
  document.getElementById('auth-btn').textContent = isLogin ? '登录' : '注册'
  document.getElementById('toggle-text').textContent = isLogin ? '没有账号？' : '已有账号？'
  document.getElementById('toggle-link').textContent = isLogin ? '注册' : '登录'
})

document.getElementById('auth-btn').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim()
  const password = document.getElementById('auth-password').value
  if (!email || !password) return alert('请填写邮箱和密码')
  const { error } = isLogin
    ? await supabase.auth.signInWithPassword({ email, password })
    : await supabase.auth.signUp({ email, password })
  if (error) return alert(error.message)
  if (!isLogin) alert('注册成功，已自动登录')
  checkAuth()
})

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => switchTab(item.dataset.tab))
})

document.getElementById('hidden-upload').addEventListener('change', async (e) => {
  const files = e.target.files
  for (const file of files) {
    const safeFile = new File([file], file.name.replace(/[^a-zA-Z0-9._-]/g, '_'), { type: file.type })
    addUploadTask(safeFile)
  }
  document.getElementById('hidden-upload').value = ''
})

function addUploadTask(file) {
  if (file.size > 50 * 1024 * 1024) return alert('文件不能超过 50MB')
  const task = { id: Date.now() + Math.random(), name: file.name, progress: 0, status: 'waiting', file }
  uploadTasks.push(task)
  renderUploadTasks()
  startUpload(task)
}

async function startUpload(task) {
  if (!currentUser) return
  task.status = 'uploading'
  renderUploadTasks()
  const path = `${currentUser.id}/${Date.now()}_${task.file.name}`
  const interval = setInterval(() => {
    if (task.progress < 90) { task.progress += Math.random() * 15; if (task.progress > 90) task.progress = 90; renderUploadTasks() }
  }, 300)
  try {
    const { error } = await supabase.storage.from('user-files').upload(path, task.file, { contentType: 'application/octet-stream' })
    clearInterval(interval)
    if (error) throw error
    await supabase.from('files').insert({ user_id: currentUser.id, name: task.file.name, size: task.file.size, type: task.file.type, storage_path: path })
    task.progress = 100; task.status = 'success'
  } catch (err) {
    clearInterval(interval)
    task.status = 'error'; task.errorMsg = err.message
  }
  renderUploadTasks()
  loadFiles()
  loadHomeData()
}

function renderUploadTasks() {
  document.getElementById('upload-task-list').innerHTML = uploadTasks.map(t => `
    <div class="upload-task">
      <div style="display:flex;justify-content:space-between"><span>${t.name}</span><span>${t.status==='waiting'?'等待':t.status==='uploading'?'上传中':t.status==='success'?'完成':'失败'}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${t.progress}%;background:${t.status==='error'?'#e74c3c':'#4e6ef2'}"></div></div>
      ${t.status==='error'?`<div style="font-size:12px;color:#e74c3c">${t.errorMsg}</div>`:''}
    </div>
  `).join('')
}

window.switchTab = function(tab) {
  currentTab = tab
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  const page = document.getElementById('page-' + tab)
  if (page) page.classList.add('active')
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active')
  if (tab === 'home') buildHomePage()
  if (tab === 'files') buildFilesPage()
  if (tab === 'me') buildMePage()
  if (tab === 'settings') buildSettingsPage()
  if (tab === 'feedback') buildFeedbackPage()
  if (tab === 'shareHistory') buildShareHistoryPage()
  if (tab === 'trash') buildTrashPage()
  if (tab === 'dynamic') buildDynamicPage()
}

function buildHomePage() {
  document.getElementById('page-home').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:60px 16px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="avatar" style="width:36px;height:36px;border-radius:50%;background:#4e6ef2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px">${currentUser?.email?.charAt(0)?.toUpperCase()||'U'}</div>
        <span style="font-weight:500">${currentUser?.email||''}</span>
      </div>
      <div style="display:flex;gap:12px">
        <div onclick="document.getElementById('upload-panel').classList.add('open');document.getElementById('overlay').classList.add('show')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="fab" style="position:static;width:36px;height:36px;font-size:18px" onclick="document.getElementById('hidden-upload').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>
    </div>
    <div class="section-title" style="margin:16px 16px 8px">最近浏览</div>
    <div class="card" id="recent-browse"></div>
    <div class="section-title" style="margin:16px 16px 8px">最近上传</div>
    <div class="card" id="recent-upload"></div>
    <div class="section-title" style="margin:16px 16px 8px">最近分享</div>
    <div class="card" id="recent-share"></div>
  `
  loadHomeData()
}

function buildFilesPage() {
  document.getElementById('page-files').innerHTML = `
    <div style="padding:12px 16px;background:var(--card-bg);border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><h3>云文件</h3><span style="color:var(--text2)">排序</span></div>
      <input type="text" id="search-input" placeholder="搜索文件..." oninput="renderFiles()">
    </div>
    <div class="chip-scroll">
      <div class="chip active" data-filter="all">全部</div>
      <div class="chip" data-filter="image">图片</div>
      <div class="chip" data-filter="video">视频</div>
      <div class="chip" data-filter="archive">压缩包</div>
      <div class="chip" data-filter="other">其他</div>
    </div>
    <div id="file-container" style="padding:0 16px"></div>
    <button class="fab" id="fab-btn" onclick="document.getElementById('hidden-upload').click()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  `
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'))
      chip.classList.add('active')
      currentFilter = chip.dataset.filter
      renderFiles()
    })
  })
  renderFiles()
}

function buildMePage() {
  document.getElementById('page-me').innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:12px">
      <div style="width:48px;height:48px;border-radius:50%;background:#4e6ef2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">U</div>
      <div><div style="font-weight:500">${currentUser?.email||''}</div><div style="font-size:12px;color:var(--text2)">关注 0 | 粉丝 0</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between"><span>已用 <span id="used-size">0 B</span> / 1 GB</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center">
      <div onclick="switchTab('shareHistory')"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg><div style="font-size:12px">分享历史</div></div>
      <div onclick="switchTab('dynamic')"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div style="font-size:12px">动态</div></div>
      <div onclick="switchTab('trash')"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><div style="font-size:12px">垃圾站</div></div>
    </div>
    <div class="card" onclick="switchTab('settings')"><div style="display:flex;align-items:center;gap:8px"><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>设置</span></div></div>

window.renderFiles = function() {
  const search = document.getElementById('search-input')?.value?.toLowerCase() || ''
  let filtered = allFiles
  if (search) filtered = filtered.filter(f => f.name.toLowerCase().includes(search))
  if (currentFilter === 'image') filtered = filtered.filter(f => f.type?.startsWith('image/'))
  else if (currentFilter === 'video') filtered = filtered.filter(f => f.type?.startsWith('video/'))
  else if (currentFilter === 'archive') filtered = filtered.filter(f => /zip|rar|7z|tar|gz/.test(f.type||''))
  else if (currentFilter === 'other') filtered = filtered.filter(f => f.type && !f.type.startsWith('image/') && !f.type.startsWith('video/') && !/zip|rar|7z|tar|gz/.test(f.type))
  const container = document.getElementById('file-container')
  if (!container) return
  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">暂无文件</div>'
    return
  }
  container.innerHTML = filtered.map(f => `
    <div class="file-row">
      <div class="file-icon">${getFileIconHTML(f.type)}</div>
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${formatSize(f.size)} · ${new Date(f.created_at).toLocaleDateString()}</div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="btn-primary" style="padding:4px 8px;font-size:12px" data-view="${f.storage_path}" data-name="${f.name}">查看</button>
        <button class="btn-primary" style="padding:4px 8px;font-size:12px;background:#fff;color:#4e6ef2;border:1px solid #4e6ef2" data-share="${f.id}">分享</button>
        <button class="btn-primary" style="padding:4px 8px;font-size:12px;background:#fff;color:#e74c3c;border:1px solid #e74c3c" data-delete="${f.id}" data-path="${f.storage_path}" data-name="${f.name}">删除</button>
      </div>
    </div>
  `).join('')
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => {
      supabase.storage.from('user-files').createSignedUrl(btn.dataset.view, 60).then(({ data }) => {
        if (data?.signedUrl) {
          window.open(data.signedUrl, '_blank')
          addBrowseHistory(btn.dataset.name)
          loadHomeData()
        }
      })
    }
  })
  document.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const code = Math.random().toString(36).substring(2, 6).toUpperCase()
      await supabase.from('share_links').insert({
        file_id: btn.dataset.share, creator_id: currentUser.id, code,
        expires_at: new Date(Date.now() + 7*24*60*60*1000)
      })
      const link = `${location.origin}${location.pathname}?code=${code}`
      prompt('分享链接：', link)
      navigator.clipboard.writeText(link).catch(()=>{})
    }
  })
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除？')) return
      addTrashItem({ name: btn.dataset.name, time: new Date().toLocaleString() })
      await supabase.from('files').delete().eq('id', btn.dataset.delete)
      await supabase.storage.from('user-files').remove([btn.dataset.path])
      loadFiles()
      if (currentTab === 'home') loadHomeData()
    }
  })
}

function getFileIconHTML(type) {
  if (!type) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
  if (type.startsWith('image/')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
  if (type.startsWith('video/')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  if (type.includes('pdf')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>'
  if (/zip|rar|7z|tar|gz/.test(type)) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M21 8v12a2 2 0 01-2 2H5a2 2 0 01-2-2V8"/><polyline points="11 12 11 2 13 2 13 12"/><line x1="7" y1="6" x2="17" y2="6"/></svg>'
  return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
}

function addBrowseHistory(name) {
  let history = JSON.parse(localStorage.getItem('browseHistory') || '[]')
  history.unshift({ name, time: new Date().toLocaleString() })
  if (history.length > 20) history = history.slice(0, 20)
  localStorage.setItem('browseHistory', JSON.stringify(history))
}

function addTrashItem(file) {
  let trash = JSON.parse(localStorage.getItem('trash') || '[]')
  trash.unshift(file)
  localStorage.setItem('trash', JSON.stringify(trash))
}

function loadTrash() {
  const trash = JSON.parse(localStorage.getItem('trash') || '[]')
  const container = document.getElementById('trash-list')
  if (!container) return
  container.innerHTML = trash.length === 0 ? '<div style="text-align:center;padding:40px;color:var(--text2)">垃圾站为空</div>' :
    trash.map(i => `<div class="file-row"><div class="file-info"><div class="file-name">${i.name}</div><div class="file-meta">${i.time}</div></div></div>`).join('')
}

window.clearTrash = () => { localStorage.removeItem('trash'); loadTrash(); showToast('已清空') }

async function loadShareHistory() {
  const { data } = await supabase.from('share_links').select('files(name), code, created_at').eq('creator_id', currentUser?.id).order('created_at', { ascending: false })
  const container = document.getElementById('share-history-list')
  if (!container) return
  container.innerHTML = (!data || data.length === 0) ? '<div style="text-align:center;padding:40px;color:var(--text2)">暂无分享记录</div>' :
    data.map(s => `<div class="file-row"><div class="file-info"><div class="file-name">${s.files?.name||'未知'}</div><div class="file-meta">提取码: ${s.code} · ${new Date(s.created_at).toLocaleDateString()}</div></div></div>`).join('')
}

window.clearShareHistory = async () => {
  if (!confirm('清空所有分享记录？')) return
  await supabase.from('share_links').delete().eq('creator_id', currentUser.id)
  loadShareHistory()
  showToast('已清空')
}

async function loadDynamic() {
  const [filesRes, sharesRes] = await Promise.all([
    supabase.from('files').select('name, created_at').eq('user_id', currentUser?.id).order('created_at', { ascending: false }).limit(10),
    supabase.from('share_links').select('files(name), created_at').eq('creator_id', currentUser?.id).order('created_at', { ascending: false }).limit(10)
  ])
  let acts = []
  if (filesRes.data) filesRes.data.forEach(f => acts.push({ type:'upload', name: f.name, time: f.created_at }))
  if (sharesRes.data) sharesRes.data.forEach(s => acts.push({ type:'share', name: s.files?.name||'未知', time: s.created_at }))
  acts.sort((a,b) => new Date(b.time) - new Date(a.time))
  const container = document.getElementById('dynamic-list')
  if (!container) return
  container.innerHTML = acts.length === 0 ? '<div style="text-align:center;padding:40px;color:var(--text2)">暂无动态</div>' :
    acts.slice(0,15).map(a => `<div class="file-row"><div class="file-info"><div class="file-name">${a.type==='upload'?'上传了':'分享了'} ${a.name}</div><div class="file-meta">${new Date(a.time).toLocaleString()}</div></div></div>`).join('')
}

async function loadHomeData() {
  if (!currentUser) return
  const history = JSON.parse(localStorage.getItem('browseHistory') || '[]')
  document.getElementById('recent-browse').innerHTML = history.length === 0 ? '<div style="color:var(--text2);text-align:center">暂无浏览记录</div>' :
    history.slice(0,5).map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${h.name} <span style="color:var(--text2);float:right">${h.time}</span></div>`).join('')

  const { data: uploads } = await supabase.from('files').select('name,created_at').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(3)
  document.getElementById('recent-upload').innerHTML = (uploads && uploads.length > 0) ?
    uploads.map(f => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${f.name} <span style="color:var(--text2);float:right">${new Date(f.created_at).toLocaleDateString()}</span></div>`).join('') :
    '<div style="color:var(--text2);text-align:center">暂无上传记录</div>'

  const { data: shares } = await supabase.from('share_links').select('files(name), created_at').eq('creator_id', currentUser.id).order('created_at', { ascending: false }).limit(3)
  document.getElementById('recent-share').innerHTML = (shares && shares.length > 0) ?
    shares.map(s => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${s.files?.name||'未知'} <span style="color:var(--text2);float:right">${new Date(s.created_at).toLocaleDateString()}</span></div>`).join('') :
    '<div style="color:var(--text2);text-align:center">暂无分享记录</div>'
}

async function loadShare(code) {
  const { data: links, error } = await supabase.from('share_links').select('*, files(*)').eq('code', code).maybeSingle()
  const content = document.getElementById('share-content')
  if (error || !links) { content.innerHTML = '<p style="color:#e74c3c">分享不存在或已失效</p>'; return }
  if (links.expires_at && new Date(links.expires_at) < new Date()) { content.innerHTML = '<p style="color:#e74c3c">分享已过期</p>'; return }
  const file = links.files
  content.innerHTML = `<div style="font-size:18px;margin-bottom:8px">${file.name}</div><div style="color:var(--text2);margin-bottom:24px">${formatSize(file.size)}</div><button class="btn-primary" id="download-share-btn">下载文件</button>`
  document.getElementById('download-share-btn').onclick = async () => {
    const { data } = await supabase.storage.from('user-files').createSignedUrl(file.storage_path, 60)
    if (data?.signedUrl) window.open(data.signedUrl, '_blank')
    else alert('无法获取下载链接')
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast')
  toast.textContent = msg
  toast.classList.add('show')
  setTimeout(() => toast.classList.remove('show'), 2000)
}

function formatSize(bytes) {
  if (!bytes) return '0 B'
  const k = 1024, sizes = ['B','KB','MB','GB']
  const i = Math.floor(Math.log(bytes) / Math.log(k))
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]
}

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession()
  if (session) {
    currentUser = session.user
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark')
    showMainPages()
  } else {
    showAuthPage()
  }
}

async function loadFiles() {
  if (!currentUser) return
  const { data } = await supabase.from('files').select('*').order('created_at', { ascending: false })
  allFiles = data || []
}

window.showPasswordModal = () => document.getElementById('pwd-modal').style.display = 'flex'
window.closePwdModal = () => document.getElementById('pwd-modal').style.display = 'none'
window.changePassword = async () => {
  const old = document.getElementById('old-password').value
  const new1 = document.getElementById('new-password1').value
  const new2 = document.getElementById('new-password2').value
  if (!old || !new1 || !new2) return alert('请填写完整')
  if (new1 !== new2) return alert('两次新密码不一致')
  try {
    const { error } = await supabase.auth.updateUser({ password: new1 })
    if (error) throw error
    showToast('密码修改成功')
    closePwdModal()
  } catch (e) { alert('修改失败：' + e.message) }
}
window.toggleTheme = () => {
  document.body.classList.toggle('dark')
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light')
  document.getElementById('theme-status').textContent = document.body.classList.contains('dark') ? '深色' : '浅色'
}
window.copyQQ = () => { navigator.clipboard.writeText('2872136504').then(() => showToast('QQ号已复制')) }

document.getElementById('close-upload-panel').addEventListener('click', () => {
  document.getElementById('upload-panel').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
})
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('upload-panel').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
})

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark')
