<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>极简云</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f5f6fa;--card-bg:#fff;--text:#222;--text2:#999;--border:#eee;
      --chip-bg:#fff;--chip-border:#ddd;--chip-active-bg:#4e6ef2;--chip-active-text:#fff;
      --input-bg:#f5f6fa;--shadow:0 4px 20px rgba(0,0,0,.06);
    }
    body.dark{
      --bg:#1a1a2e;--card-bg:#16213e;--text:#eee;--text2:#aaa;--border:#2a2a4a;
      --chip-bg:#16213e;--chip-border:#2a2a4a;--input-bg:#0f0f23;
      --shadow:0 4px 20px rgba(0,0,0,.3);
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);height:100vh;overflow:hidden;color:var(--text);transition:background .3s}
    .page{display:none;height:100vh;overflow-y:auto;padding-bottom:70px}
    .page.active{display:block}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card-bg);display:flex;border-top:1px solid var(--border);z-index:100;transition:background .3s}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text2);cursor:pointer}
    .nav-item.active{color:#4e6ef2}
    .nav-item .nav-icon{width:24px;height:24px;margin-bottom:2px}
    .btn-primary{background:#4e6ef2;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer}
    .fab{position:fixed;right:20px;bottom:80px;width:50px;height:50px;border-radius:50%;background:#4e6ef2;color:#fff;border:none;font-size:24px;box-shadow:0 4px 12px rgba(78,110,242,.4);z-index:99;cursor:pointer;display:flex;align-items:center;justify-content:center}
    input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--input-bg);color:var(--text);transition:.3s}
    input:focus{border-color:#4e6ef2}
    .card{background:var(--card-bg);border-radius:12px;padding:16px;margin:12px 16px;box-shadow:var(--shadow);transition:.3s}
    .file-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
    .file-row:last-child{border-bottom:none}
    .file-icon{width:40px;height:40px;margin-right:12px;display:flex;align-items:center;justify-content:center;background:#f0f2ff;border-radius:8px}
    .file-info{flex:1;min-width:0}
    .file-name{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-meta{font-size:12px;color:var(--text2);margin-top:2px}
    .chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;white-space:nowrap}
    .chip{padding:6px 14px;border-radius:16px;font-size:13px;background:var(--chip-bg);border:1px solid var(--chip-border);cursor:pointer;flex-shrink:0;color:var(--text)}
    .chip.active{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg)}
    .progress-bar{height:6px;background:rgba(0,0,0,.1);border-radius:3px;margin:8px 0;overflow:hidden}
    .progress-fill{height:100%;background:#4e6ef2;border-radius:3px}
    .splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#4e6ef2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
    .splash h1{color:#fff;font-size:28px;margin-bottom:8px;font-weight:300;letter-spacing:2px}
    .splash p{color:rgba(255,255,255,.8);font-size:14px;font-weight:300}
    .skip-btn{position:fixed;top:20px;right:20px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 14px;border-radius:16px;font-size:13px;z-index:10000;cursor:pointer}
    .svg-icon{width:20px;height:20px;display:inline-block;vertical-align:middle}
    .back-btn{display:flex;align-items:center;gap:6px;color:#4e6ef2;cursor:pointer;margin-bottom:16px;font-size:14px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}
    .section-title{font-size:14px;color:var(--text2);margin:16px 16px 8px}
  </style>
</head>
<body>

<div class="splash" id="splash"><h1>极简云</h1><p>分享 / 储存 / 下载</p></div>
<span class="skip-btn" id="skip-btn">5s 跳过</span>

<div class="page active" id="page-home">
  <div style="padding:60px 16px 0;text-align:center" id="home-username"></div>
  <div class="section-title">最近浏览</div>
  <div class="card" id="recent-browse"><div style="color:var(--text2);text-align:center">暂无浏览记录</div></div>
  <div class="section-title">最近上传</div>
  <div class="card" id="recent-upload"><div style="color:var(--text2);text-align:center">暂无上传记录</div></div>
  <div class="section-title">最近分享</div>
  <div class="card" id="recent-share"><div style="color:var(--text2);text-align:center">暂无分享记录</div></div>
</div>

<div class="page" id="page-files">
  <div style="padding:12px 16px;background:var(--card-bg);border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h3 style="font-weight:500">云文件</h3>
      <span style="color:var(--text2);font-size:13px">排序</span>
    </div>
    <input type="text" id="search-input" placeholder="搜索文件..." oninput="renderFiles()">
  </div>
  <div class="chip-scroll">
    <div class="chip active" data-filter="all">全部</div>
    <div class="chip" data-filter="folder">文件夹</div>
    <div class="chip" data-filter="image">图片</div>
    <div class="chip" data-filter="video">视频</div>
    <div class="chip" data-filter="archive">压缩包</div>
    <div class="chip" data-filter="other">其他</div>
  </div>
  <div id="file-container" style="padding:0 16px"></div>
  <button class="fab" id="fab-btn">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<div class="page" id="page-me">
  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="width:48px;height:48px;border-radius:50%;background:#4e6ef2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300">U</div>
    <div>
      <div style="font-weight:500" id="me-email"></div>
      <div style="font-size:12px;color:var(--text2)">关注 0 | 粉丝 0</div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <span style="font-size:14px">已用 <span id="used-size">0 B</span> / 1 GB</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="card">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center">
      <div><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg><div style="font-size:12px;margin-top:4px">我的分享</div></div>
      <div><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div style="font-size:12px;margin-top:4px">最近</div></div>
      <div><svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><div style="font-size:12px;margin-top:4px">回收站</div></div>
    </div>
  </div>
  <div class="card" onclick="navigateTo('settings')" style="cursor:pointer">
    <div style="display:flex;align-items:center;gap:8px">
      <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>设置</span>
    </div>
  </div>
  <div class="card" onclick="navigateTo('feedback')" style="cursor:pointer">
    <div style="display:flex;align-items:center;gap:8px">
      <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>帮助与反馈</span>
    </div>
  </div>
</div>

<div class="page" id="page-settings">
  <div class="back-btn" onclick="navigateTo('me')">‹ 返回</div>
  <div class="card" onclick="showPasswordModal()">账号</div>
  <div class="card" onclick="toggleTheme()">外观 (当前: <span id="theme-status">浅色</span>)</div>
  <div class="card">版本 1.0</div>
</div>

<div class="page" id="page-feedback">
  <div class="back-btn" onclick="navigateTo('me')">‹ 返回</div>
  <div class="card" style="text-align:center">
    <p style="margin-bottom:12px">如有问题请联系开发者</p>
    <p style="font-size:20px;font-weight:bold;color:#4e6ef2">QQ: 2872136504</p>
    <button class="btn-primary" style="margin-top:16px;width:auto" onclick="copyQQ()">复制QQ号</button>
  </div>
</div>

<div id="pwd-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--card-bg);border-radius:12px;padding:24px;width:300px">
    <h3 style="margin-bottom:16px">修改密码</h3>
    <input type="password" id="old-password" placeholder="旧密码">
    <input type="password" id="new-password1" placeholder="新密码">
    <input type="password" id="new-password2" placeholder="确认新密码">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn-primary" style="background:#eee;color:#333" onclick="closePwdModal()">取消</button>
      <button class="btn-primary" onclick="changePassword()">确认</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" data-tab="home">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </div>
  <div class="nav-item" data-tab="files">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    文件
  </div>
  <div class="nav-item" data-tab="me">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    我的
  </div>
</div>

<input type="file" id="hidden-upload" multiple style="display:none">
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://plwljusbfqkvlhpclvsv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsd2xqdXNiZnFrdmxocGNsdnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzk1MTUsImV4cCI6MjEwMTg1NTUxNX0.BDVqL87UWewkYt1j-z8O3Am_3tML954F4Pyi71T_Rd0')

let allFiles = []
let currentFilter = 'all'
let currentTab = 'home'
let currentUser = null

const splash = document.getElementById('splash')
const skipBtn = document.getElementById('skip-btn')
let countdown = 5
let splashTimer = null

function startSplash() {
  skipBtn.textContent = countdown + 's 跳过'
  splashTimer = setInterval(() => {
    countdown--
    if (countdown <= 0) {
      clearInterval(splashTimer)
      hideSplash()
    } else {
      skipBtn.textContent = countdown + 's 跳过'
    }
  }, 1000)
}

function hideSplash() {
  splash.style.display = 'none'
  skipBtn.style.display = 'none'
  checkAuth()
}

skipBtn.addEventListener('click', () => {
  clearInterval(splashTimer)
  hideSplash()
})
startSplash()

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    switchTab(item.dataset.tab)
  })
})

document.getElementById('fab-btn').addEventListener('click', () => {
  document.getElementById('hidden-upload').click()
})

document.getElementById('hidden-upload').addEventListener('change', async (e) => {
  const files = e.target.files
  for (const file of files) await uploadFile(file)
  document.getElementById('hidden-upload').value = ''
})

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'))
    chip.classList.add('active')
    currentFilter = chip.dataset.filter
    renderFiles()
  })
})

window.showPasswordModal = function() {
  document.getElementById('pwd-modal').style.display = 'flex'
}

window.closePwdModal = function() {
  document.getElementById('pwd-modal').style.display = 'none'
}

window.changePassword = async function() {
  const oldPwd = document.getElementById('old-password').value
  const new1 = document.getElementById('new-password1').value
  const new2 = document.getElementById('new-password2').value
  if (!oldPwd || !new1 || !new2) return alert('请填写完整')
  if (new1 !== new2) return alert('两次新密码不一致')
  try {
    const { error } = await supabase.auth.updateUser({ password: new1 })
    if (error) throw error
    showToast('密码修改成功')
    closePwdModal()
  } catch (e) {
    alert('修改失败：' + e.message)
  }
}

window.toggleTheme = function() {
  document.body.classList.toggle('dark')
  const status = document.getElementById('theme-status')
  status.textContent = document.body.classList.contains('dark') ? '深色' : '浅色'
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light')
}

window.copyQQ = function() {
  navigator.clipboard.writeText('2872136504').then(() => showToast('QQ号已复制'))
}

window.navigateTo = function(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.getElementById('page-' + page).classList.add('active')
  if (page === 'me') document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
}

window.switchTab = function(tab) {
  currentTab = tab
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  document.getElementById('page-' + tab).classList.add('active')
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active')
  if (tab === 'files' || tab === 'me') loadFiles()
  if (tab === 'home') loadHomeData()
}

async function uploadFile(file) {
  if (!currentUser) return
  const path = `${currentUser.id}/${Date.now()}_${file.name}`
  const { error } = await supabase.storage.from('user-files').upload(path, file)
  if (error) return alert('上传失败')
  await supabase.from('files').insert({
    user_id: currentUser.id, name: file.name, size: file.size, type: file.type, storage_path: path
  })
  loadFiles()
  loadHomeData()
}

async function loadFiles() {
  if (!currentUser) return
  const { data } = await supabase.from('files').select('*').order('created_at', { ascending: false })
  allFiles = data || []
  if (currentTab === 'me') {
    const totalSize = allFiles.reduce((sum, f) => sum + (f.size || 0), 0)
    document.getElementById('used-size').textContent = formatSize(totalSize)
    const pct = Math.min((totalSize / (1024*1024*1024)) * 100, 100)
    document.getElementById('progress-fill').style.width = pct + '%'
    document.getElementById('me-email').textContent = currentUser.email
  }
  if (currentTab === 'files') renderFiles()
}

function getFileIconHTML(type) {
  if (!type) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
  if (type.startsWith('image/')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
  if (type.startsWith('video/')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  if (type.includes('pdf')) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>'
  if (/zip|rar|7z|tar|gz/.test(type)) return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M21 8v12a2 2 0 01-2 2H5a2 2 0 01-2-2V8"/><polyline points="11 12 11 2 13 2 13 12"/><line x1="7" y1="6" x2="17" y2="6"/></svg>'
  return '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
}

window.renderFiles = function() {
  const search = document.getElementById('search-input')?.value?.toLowerCase() || ''
  let filtered = allFiles
  if (search) filtered = filtered.filter(f => f.name.toLowerCase().includes(search))
  if (currentFilter === 'image') filtered = filtered.filter(f => f.type?.startsWith('image/'))
  else if (currentFilter === 'video') filtered = filtered.filter(f => f.type?.startsWith('video/'))
  else if (currentFilter === 'archive') filtered = filtered.filter(f => /zip|rar|7z|tar|gz/.test(f.type||''))
  else if (currentFilter === 'folder') filtered = filtered.filter(f => !f.type)
  else if (currentFilter === 'other') filtered = filtered.filter(f => f.type && !f.type.startsWith('image/') && !f.type.startsWith('video/') && !/zip|rar|7z|tar|gz/.test(f.type))
  const container = document.getElementById('file-container')
  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">暂无文件</div>'
    return
  }
  container.innerHTML = filtered.map(f => `
    <div class="file-row">
      <div class="file-icon">${getFileIconHTML(f.type)}</div>
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-meta">${formatSize(f.size)} · ${new Date(f.created_at).toLocaleDateString()}</div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="btn-primary" style="padding:4px 8px;font-size:12px" data-download="${f.storage_path}" data-name="${f.name}">下载</button>
        <button class="btn-primary" style="padding:4px 8px;font-size:12px;background:#fff;color:#4e6ef2;border:1px solid #4e6ef2" data-share="${f.id}">分享</button>
        <button class="btn-primary" style="padding:4px 8px;font-size:12px;background:#fff;color:#e74c3c;border:1px solid #e74c3c" data-delete="${f.id}" data-path="${f.storage_path}">删除</button>
      </div>
    </div>
  `).join('')
  document.querySelectorAll('[data-download]').forEach(btn => {
    btn.onclick = () => {
      supabase.storage.from('user-files').createSignedUrl(btn.dataset.download, 60).then(({ data }) => {
        if (data?.signedUrl) {
          window.open(data.signedUrl, '_blank')
          addBrowseHistory(btn.dataset.name)
          loadHomeData()
        }
      })
    }
  })
  document.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const code = Math.random().toString(36).substring(2, 6).toUpperCase()
      await supabase.from('share_links').insert({
        file_id: btn.dataset.share,
        creator_id: currentUser.id,
        code,
        expires_at: new Date(Date.now() + 7*24*60*60*1000)
      })
      const link = `${location.origin}${location.pathname}?code=${code}`
      prompt('分享链接（已复制到剪贴板）：', link)
      navigator.clipboard.writeText(link).catch(()=>{})
      loadHomeData()
    }
  })
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除？')) return
      await supabase.from('files').delete().eq('id', btn.dataset.delete)
      await supabase.storage.from('user-files').remove([btn.dataset.path])
      loadFiles()
      loadHomeData()
    }
  })
}

function addBrowseHistory(name) {
  let history = JSON.parse(localStorage.getItem('browseHistory') || '[]')
  history.unshift({ name, time: new Date().toLocaleString() })
  if (history.length > 20) history = history.slice(0, 20)
  localStorage.setItem('browseHistory', JSON.stringify(history))
}

async function loadHomeData() {
  document.getElementById('home-username').textContent = currentUser ? currentUser.email : ''
  let history = JSON.parse(localStorage.getItem('browseHistory') || '[]')
  const historyDiv = document.getElementById('recent-browse')
  if (history.length === 0) {
    historyDiv.innerHTML = '<div style="color:var(--text2);text-align:center">暂无浏览记录</div>'
  } else {
    historyDiv.innerHTML = history.slice(0,5).map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${h.name} <span style="color:var(--text2);float:right">${h.time}</span></div>`).join('')
  }

  const uploadDiv = document.getElementById('recent-upload')
  const { data: uploads } = await supabase.from('files').select('name,created_at').eq('user_id', currentUser?.id).order('created_at', { ascending: false }).limit(3)
  if (uploads && uploads.length > 0) {
    uploadDiv.innerHTML = uploads.map(f => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${f.name} <span style="color:var(--text2);float:right">${new Date(f.created_at).toLocaleDateString()}</span></div>`).join('')
  } else {
    uploadDiv.innerHTML = '<div style="color:var(--text2);text-align:center">暂无上传记录</div>'
  }

  const shareDiv = document.getElementById('recent-share')
  const { data: shares } = await supabase.from('share_links').select('files(name), created_at').eq('creator_id', currentUser?.id).order('created_at', { ascending: false }).limit(3)
  if (shares && shares.length > 0) {
    shareDiv.innerHTML = shares.map(s => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${s.files?.name || '未知'} <span style="color:var(--text2);float:right">${new Date(s.created_at).toLocaleDateString()}</span></div>`).join('')
  } else {
    shareDiv.innerHTML = '<div style="color:var(--text2);text-align:center">暂无分享记录</div>'
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast')
  toast.textContent = msg
  toast.classList.add('show')
  setTimeout(() => toast.classList.remove('show'), 2000)
}

function formatSize(bytes) {
  if (!bytes) return '0 B'
  const k = 1024, sizes = ['B', 'KB', 'MB', 'GB']
  const i = Math.floor(Math.log(bytes) / Math.log(k))
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]
}

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession()
  if (session) {
    currentUser = session.user
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark')
    }
    loadFiles()
    loadHomeData()
  } else {
    window.location.href = '/login.html'
  }
}

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark')
document.getElementById('theme-status').textContent = document.body.classList.contains('dark') ? '深色' : '浅色'
</script>
