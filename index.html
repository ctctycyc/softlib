<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>极简云</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg: linear-gradient(160deg, #f7f9fc 0%, #eef1f6 100%);
      --card-bg: rgba(255,255,255,0.75);
      --text:#222;--text2:#6b7280;--border:rgba(0,0,0,0.04);
      --chip-bg:rgba(255,255,255,0.7);--chip-border:rgba(0,0,0,0.06);
      --input-bg:rgba(255,255,255,0.8);
      --shadow:0 12px 40px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.02);
      --backdrop: blur(24px);
    }
    body.dark{
      --bg: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 100%);
      --card-bg:rgba(22,33,62,0.7);
      --text:#e5e7eb;--text2:#9ca3af;--border:rgba(255,255,255,0.04);
      --chip-bg:rgba(22,33,62,0.6);--chip-border:rgba(255,255,255,0.06);
      --input-bg:rgba(15,15,35,0.7);
      --shadow:0 12px 40px rgba(0,0,0,0.3);
    }
    body{
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); height: 100vh; overflow: hidden; color: var(--text);
      transition: background 0.5s ease;
    }
    .page{display:none;height:100vh;overflow-y:auto;padding-bottom:70px}
    .page.active{display:block;animation: pageIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)}
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;height:60px;
      background:var(--card-bg);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
      display:none;border-top:1px solid var(--border);z-index:100;
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:11px;color:var(--text2);cursor:pointer;transition:color 0.2s, transform 0.2s;
    }
    .nav-item.active{color:#4e6ef2;transform:scale(1.05)}
    .nav-item:active{transform:scale(0.95)}
    .nav-item .nav-icon{width:24px;height:24px;margin-bottom:2px;transition:stroke 0.3s}
    .btn-primary{
      background:linear-gradient(135deg, #4e6ef2 0%, #6d7cf7 100%);
      color:#fff;border:none;border-radius:14px;padding:11px 22px;
      font-size:14px;font-weight:500;cursor:pointer;
      transition:all 0.25s;box-shadow:0 4px 16px rgba(78,110,242,0.25);
    }
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(78,110,242,0.35)}
    .btn-primary:active{transform:scale(0.97)}
    .fab{
      position:fixed;right:20px;bottom:80px;width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg, #4e6ef2 0%, #6d7cf7 100%);
      color:#fff;border:none;font-size:26px;
      box-shadow:0 8px 24px rgba(78,110,242,0.35);z-index:99;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.3s;animation: fabIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes fabIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    .fab:active{transform:scale(0.9) rotate(90deg)}
    input{
      width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:14px;
      font-size:14px;outline:none;background:var(--input-bg);color:var(--text);
      transition:all 0.3s;-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
    }
    input:focus{border-color:#4e6ef2;box-shadow:0 0 0 4px rgba(78,110,242,0.08)}
    .card{
      background:var(--card-bg);border-radius:20px;padding:18px;margin:12px 16px;
      box-shadow:var(--shadow);transition:all 0.3s;
      -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
      animation: cardFadeIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes cardFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .card:active{transform:scale(0.99)}
    .file-row{
      display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);
      transition:background 0.2s;
    }
    .file-row:hover{background:rgba(78,110,242,0.02)}
    .file-row:last-child{border-bottom:none}
    .file-icon{width:46px;height:46px;margin-right:14px;display:flex;align-items:center;justify-content:center;background:rgba(78,110,242,0.06);border-radius:14px;transition:transform 0.2s}
    .file-row:hover .file-icon{transform:scale(1.04)}
    .file-info{flex:1;min-width:0}
    .file-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-meta{font-size:12px;color:var(--text2);margin-top:2px}
    .chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 16px}
    .chip{
      padding:7px 18px;border-radius:22px;font-size:13px;font-weight:500;
      background:var(--chip-bg);border:1px solid var(--chip-border);
      cursor:pointer;color:var(--text);transition:all 0.3s;
      -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
    }
    .chip.active{background:#4e6ef2;color:#fff;border-color:#4e6ef2;box-shadow:0 4px 12px rgba(78,110,242,0.25)}
    .chip:active{transform:scale(0.96)}
    .progress-bar{height:6px;background:rgba(0,0,0,0.04);border-radius:3px;margin:10px 0;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg, #4e6ef2, #6d7cf7);border-radius:3px;transition:width 0.6s ease}
    .splash{
      position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(145deg, #4e6ef2 0%, #6d7cf7 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:9999;
    }
    .splash h1{color:#fff;font-size:32px;font-weight:400;letter-spacing:3px;animation: splashText 1s ease}
    .splash p{color:rgba(255,255,255,0.8);font-size:15px;margin-top:8px;font-weight:300;animation: splashText 1s ease 0.15s both}
    @keyframes splashText{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .skip-btn{
      position:fixed;top:20px;right:20px;background:rgba(255,255,255,0.15);
      color:#fff;border:1px solid rgba(255,255,255,0.25);padding:7px 18px;
      border-radius:24px;font-size:13px;z-index:10000;cursor:pointer;
      backdrop-filter:blur(10px);transition:background 0.3s;
    }
    .skip-btn:hover{background:rgba(255,255,255,0.25)}
    .auth-container{display:flex;align-items:center;justify-content:center;height:100vh}
    .auth-card{
      background:var(--card-bg);padding:36px 28px;border-radius:24px;
      box-shadow:var(--shadow);width:90%;max-width:400px;
      -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
      animation: cardFadeIn 0.5s ease;
    }
    .auth-card h2{font-size:26px;font-weight:500;margin-bottom:4px}
    .auth-card .sub{color:var(--text2);margin-bottom:24px;font-size:14px}
    .auth-card input{margin-bottom:14px}
    .auth-toggle{text-align:center;margin-top:16px;font-size:14px;color:var(--text2)}
    .auth-toggle span{color:#4e6ef2;cursor:pointer;font-weight:500}
    .share-header{display:flex;align-items:center;padding:18px;background:var(--card-bg);border-bottom:1px solid var(--border)}
    .share-info-card{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card-bg);margin:14px 16px;border-radius:18px}
    .share-controls{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card-bg);margin:0 16px;border-radius:18px}
    .share-file-item{display:flex;align-items:center;padding:14px 18px;background:var(--card-bg);margin:0 16px;border-radius:18px;margin-top:8px}
    .save-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 18px;background:var(--card-bg);border-top:1px solid var(--border);display:flex;justify-content:flex-start}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s}
    .toast.show{opacity:1}
    .upload-panel{position:fixed;top:0;right:0;width:320px;max-width:85vw;height:100vh;background:var(--card-bg);z-index:150;transform:translateX(100%);transition:transform 0.3s;display:flex;flex-direction:column}
    .upload-panel.open{transform:translateX(0)}
    .upload-panel-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .upload-panel-body{flex:1;overflow-y:auto;padding:18px}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:149;display:none}
    .overlay.show{display:block}
    .section-header{display:flex;align-items:center;gap:8px;margin:22px 16px 10px;font-size:14px;color:var(--text2);font-weight:500}
    .section-header svg{width:18px;height:18px;opacity:0.7}
    .home-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
    .home-item:last-child{border-bottom:none}
    .home-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    .home-item .time{font-size:12px;color:var(--text2);margin-left:8px}
    .btn-sm{padding:5px 14px;font-size:12px;border-radius:10px;margin-left:6px;transition:all 0.2s;font-weight:500}
    .btn-outline{background:transparent;border:1px solid #4e6ef2;color:#4e6ef2}
    .btn-outline:hover{background:rgba(78,110,242,0.04)}
    .btn-danger{background:transparent;border:1px solid #e74c3c;color:#e74c3c}
    .btn-danger:hover{background:rgba(231,76,60,0.04)}
  </style>
</head>
<body>

<div class="splash" id="splash"><h1>极简云</h1><p>分享 · 储存 · 下载</p></div>
<span class="skip-btn" id="skip-btn">5s 跳过</span>

<div id="auth-page" style="display:none">
  <div class="auth-container">
    <div class="auth-card">
      <h2 id="auth-title">登录</h2>
      <p class="sub" id="auth-sub">欢迎回来</p>
      <input type="email" id="auth-email" placeholder="邮箱" autocomplete="email">
      <input type="password" id="auth-password" placeholder="密码">
      <button class="btn-primary" id="auth-btn">登录</button>
      <div class="auth-toggle">
        <span id="toggle-text">没有账号？</span>
        <span id="toggle-link" style="color:#4e6ef2;cursor:pointer">注册</span>
      </div>
    </div>
  </div>
</div>

<div id="main-container" style="display:none">
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-files"></div>
  <div class="page" id="page-me"></div>
  <div class="page" id="page-settings"></div>
  <div class="page" id="page-feedback"></div>
  <div class="page" id="page-shareHistory"></div>
  <div class="page" id="page-tempmail"></div>
</div>

<div id="share-page" style="display:none">
  <div class="share-header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    <span style="font-weight:500;margin-left:8px;color:#4e6ef2">极简云</span>
  </div>
  <div class="share-info-card" id="share-info-card">
    <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg, #4e6ef2, #6d7cf7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px">U</div>
    <div style="flex:1"><div style="font-weight:500" id="share-user-email">用户</div><div style="font-size:12px;color:var(--text2)">分享的文件</div></div>
    <div style="background:rgba(78,110,242,0.08);padding:5px 14px;border-radius:20px;font-size:12px;color:#4e6ef2;font-weight:500">来自分享</div>
  </div>
  <div class="share-controls">
    <div style="display:flex;align-items:center;gap:8px"><span style="font-weight:500">文件列表</span><span style="font-size:12px;color:var(--text2)">1项</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <input type="checkbox" style="width:18px;height:18px;accent-color:#4e6ef2" checked disabled>
    </div>
  </div>
  <div class="share-file-item" id="share-file-item">
    <div class="file-icon" id="share-file-icon"></div>
    <div class="file-info">
      <div class="file-name" id="share-file-name"></div>
      <div class="file-meta" id="share-file-meta"></div>
    </div>
    <input type="checkbox" style="width:18px;height:18px;accent-color:#4e6ef2" checked disabled>
  </div>
  <div class="save-bar">
    <button class="btn-primary" id="login-save-btn">登录并保存</button>
  </div>
</div>

<div class="upload-panel" id="upload-panel">
  <div class="upload-panel-header"><span>上传进度</span><span style="cursor:pointer;font-size:20px" id="close-upload-panel">&times;</span></div>
  <div class="upload-panel-body" id="upload-task-list"></div>
</div>
<div class="overlay" id="overlay"></div>

<div class="bottom-nav" id="bottom-nav">
  <div class="nav-item active" data-tab="home">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    首页
  </div>
  <div class="nav-item" data-tab="files">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    文件
  </div>
  <div class="nav-item" data-tab="me">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    我的
  </div>
</div>

<input type="file" id="hidden-upload" multiple style="display:none">
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://plwljusbfqkvlhpclvsv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsd2xqdXNiZnFrdmxocGNsdnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzk1MTUsImV4cCI6MjEwMTg1NTUxNX0.BDVqL87UWewkYt1j-z8O3Am_3tML954F4Pyi71T_Rd0')

const TINYAPI_KEY = 'sk_18ca43cb8eceb7d240a6597b8f3509e'
const FREE_API = 'http://www.yx520.1td/API/dwz/api.php'

let allFiles = [], currentFilter = 'all', currentUser = null, uploadTasks = [], shareFileData = null
const shareCode = new URLSearchParams(location.search).get('code')


const splash = document.getElementById('splash')
const skipBtn = document.getElementById('skip-btn')
let countdown = 5
skipBtn.textContent = countdown + 's 跳过'
const timer = setInterval(() => { countdown--; skipBtn.textContent = countdown + 's 跳过'; if (countdown <= 0) { clearInterval(timer); hideSplash() } }, 1000)
skipBtn.addEventListener('click', () => { clearInterval(timer); hideSplash() })

function hideSplash() {
  splash.style.transition = 'opacity 0.5s'
  splash.style.opacity = '0'
  setTimeout(() => {
    splash.style.display = 'none'
    skipBtn.style.display = 'none'
    document.getElementById('upload-panel').classList.remove('open')
    document.getElementById('overlay').classList.remove('show')
    if (shareCode) showSharePage()
    else checkAuth()
  }, 500)
}


let isLogin = true
document.getElementById('toggle-link').addEventListener('click', () => {
  isLogin = !isLogin
  document.getElementById('auth-title').textContent = isLogin ? '登录' : '注册'
  document.getElementById('auth-sub').textContent = isLogin ? '欢迎回来' : '创建新账号'
  document.getElementById('auth-btn').textContent = isLogin ? '登录' : '注册'
  document.getElementById('toggle-text').textContent = isLogin ? '没有账号？' : '已有账号？'
  document.getElementById('toggle-link').textContent = isLogin ? '注册' : '登录'
})
document.getElementById('auth-btn').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim()
  const password = document.getElementById('auth-password').value
  if (!email || !password) return alert('请填写邮箱和密码')
  const { error } = isLogin ? await supabase.auth.signInWithPassword({ email, password }) : await supabase.auth.signUp({ email, password })
  if (error) return alert(error.message)
  if (!isLogin) alert('注册成功，已自动登录')
  if (shareCode) { document.getElementById('auth-page').style.display = 'none'; await checkAuth(); if (currentUser) saveFileToMyAccount() }
  else checkAuth()
})


document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => switchTab(item.dataset.tab)))

document.getElementById('hidden-upload').addEventListener('change', async (e) => {
  for (const file of e.target.files) {
    if (file.size > 50 * 1024 * 1024) { alert('文件超过50MB，请压缩或使用其他方式'); continue }
    const safeFile = new File([file], file.name.replace(/[^a-zA-Z0-9._-]/g, '_'), { type: file.type })
    addUploadTask(safeFile)
  }
  document.getElementById('hidden-upload').value = ''
})

function addUploadTask(file) {
  const task = { id: Date.now(), name: file.name, progress: 0, status: 'waiting', file }
  uploadTasks.push(task)
  renderUploadTasks()
  startUpload(task)
}

async function startUpload(task) {
  if (!currentUser) return
  task.status = 'uploading'
  renderUploadTasks()
  const path = `${currentUser.id}/${Date.now()}_${task.file.name}`
  const interval = setInterval(() => {
    if (task.progress < 90) { task.progress += Math.random() * 15; if (task.progress > 90) task.progress = 90; renderUploadTasks() }
  }, 300)
  try {
    const { error } = await supabase.storage.from('user-files').upload(path, task.file, { contentType: 'application/octet-stream' })
    clearInterval(interval)
    if (error) throw error
    await supabase.from('files').insert({ user_id: currentUser.id, name: task.file.name, size: task.file.size, type: task.file.type, storage_path: path, source: 'upload' })
    task.progress = 100; task.status = 'success'
  } catch (err) { clearInterval(interval); task.status = 'error'; task.errorMsg = err.message }
  renderUploadTasks()
  loadFiles()
  if (document.getElementById('page-home').classList.contains('active')) loadHomeData()
}

function renderUploadTasks() {
  document.getElementById('upload-task-list').innerHTML = uploadTasks.map(t => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between"><span>${t.name}</span><span style="color:${t.status==='success'?'#27ae60':t.status==='error'?'#e74c3c':'#666'}">${t.status==='waiting'?'等待':t.status==='uploading'?'上传中':t.status==='success'?'完成':'失败'}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${t.progress}%;background:${t.status==='error'?'#e74c3c':'linear-gradient(90deg, #4e6ef2, #6d7cf7)'}"></div></div>
      ${t.status==='error'?`<div style="font-size:12px;color:#e74c3c">${t.errorMsg}</div>`:''}
    </div>`).join('')
}

window.switchTab = function(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  const page = document.getElementById('page-' + tab)
  if (page) page.classList.add('active')
  const nav = document.querySelector(`.nav-item[data-tab="${tab}"]`)
  if (nav) nav.classList.add('active')
  if (tab === 'home') { buildHomePage(); loadHomeData() }
  else if (tab === 'files') buildFilesPage()
  else if (tab === 'me') { buildMePage(); loadFiles() }
  else if (tab === 'settings') buildSettingsPage()
  else if (tab === 'feedback') buildFeedbackPage()
  else if (tab === 'shareHistory') buildShareHistoryPage()
  else if (tab === 'tempmail') buildTempmailPage()
}

window.renderFiles = function() {
  const container = document.getElementById('file-container')
  if (!container) return
  const search = document.getElementById('search-input')?.value?.toLowerCase() || ''
  let filtered = allFiles.filter(f => f.name.toLowerCase().includes(search))
  if (currentFilter !== 'all') {
    if (currentFilter === 'image') filtered = filtered.filter(f => f.type?.startsWith('image/'))
    else if (currentFilter === 'video') filtered = filtered.filter(f => f.type?.startsWith('video/'))
    else if (currentFilter === 'archive') filtered = filtered.filter(f => /zip|rar|7z|tar|gz/.test(f.type||''))
    else if (currentFilter === 'other') filtered = filtered.filter(f => f.type && !f.type.startsWith('image/') && !f.type.startsWith('video/') && !/zip|rar|7z|tar|gz/.test(f.type))
  }
  container.innerHTML = filtered.length === 0 ? '<div style="text-align:center;padding:48px;color:var(--text2)">暂无文件</div>' : filtered.map(f => `
    <div class="file-row">
      <div class="file-icon">${getFileIconHTML(f.type)}</div>
      <div class="file-info"><div class="file-name">${f.name}</div><div class="file-meta">${formatSize(f.size)} · ${new Date(f.created_at).toLocaleDateString()}</div></div>
      <div style="display:flex;align-items:center">
        <button class="btn-primary btn-sm" data-view="${f.storage_path}" data-name="${f.name}">查看</button>
        <button class="btn-primary btn-sm btn-outline" data-share="${f.id}">分享</button>
        <button class="btn-primary btn-sm btn-danger" data-delete="${f.id}" data-path="${f.storage_path}" data-name="${f.name}">删除</button>
      </div>
    </div>`).join('')
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => supabase.storage.from('user-files').createSignedUrl(btn.dataset.view, 60).then(({ data }) => {
      if (data?.signedUrl) { window.open(data.signedUrl, '_blank'); addBrowseHistory(btn.dataset.name); if (document.getElementById('page-home').classList.contains('active')) loadHomeData() }
    })
  })
  document.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const days = prompt('请输入过期天数（0=永久有效，默认7天）：', '7')
      if (days === null) return
      const dayNum = parseInt(days)
      if (isNaN(dayNum) || dayNum < 0) { alert('请输入有效天数'); return }
      const code = Math.random().toString(36).substring(2, 6).toUpperCase()
      await supabase.from('share_links').insert({ file_id: btn.dataset.share, creator_id: currentUser.id, code, expires_at: dayNum === 0 ? null : new Date(Date.now() + dayNum * 86400000) })
      const longLink = `${location.origin}${location.pathname}?code=${code}`
      let shortLink = null
      try { const r = await fetch(`https://api.tinyaii.top/v1/shorten?url=${encodeURIComponent(longLink)}`, { headers: { 'Authorization': `Bearer ${TINYAPI_KEY}` } }); const j = await r.json(); if (j.code === 200 && j.data.url) shortLink = j.data.url } catch (e) {}
      if (!shortLink) try { const r = await fetch(`${FREE_API}?url=${encodeURIComponent(longLink)}`); const t = await r.text(); if (t.startsWith('http')) shortLink = t.trim() } catch (e) {}
      prompt('分享链接：', shortLink || longLink)
      navigator.clipboard.writeText(shortLink || longLink).catch(()=>{})
    }
  })
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除？')) return
      await supabase.from('files').delete().eq('id', btn.dataset.delete)
      await supabase.storage.from('user-files').remove([btn.dataset.path])
      loadFiles()
      if (document.getElementById('page-home').classList.contains('active')) loadHomeData()
    }
  })
}

function addBrowseHistory(name) {
  let history = JSON.parse(localStorage.getItem('browseHistory') || '[]')
  history.unshift({ name, time: new Date().toLocaleString() })
  if (history.length > 20) history = history.slice(0, 20)
  localStorage.setItem('browseHistory', JSON.stringify(history))
}

function getFileIconHTML(type) {
  if (!type) return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
  if (type.startsWith('image/')) return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
  if (type.startsWith('video/')) return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  if (type.includes('pdf')) return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>'
  if (/zip|rar|7z|tar|gz/.test(type)) return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M21 8v12a2 2 0 01-2 2H5a2 2 0 01-2-2V8"/><polyline points="11 12 11 2 13 2 13 12"/><line x1="7" y1="6" x2="17" y2="6"/></svg>'
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4e6ef2" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
}

function formatSize(bytes) {
  if (!bytes) return '0 B'
  const k = 1024, sizes = ['B','KB','MB','GB']
  const i = Math.floor(Math.log(bytes) / Math.log(k))
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]
}

async function generateTempmail() {
  try {
    const res = await fetch('https://api.tinyapi.to/p/v1/tempmail/generate', {
      headers: { 'Authorization': `Bearer ${TINYAPI_KEY}` }
    })
    const json = await res.json()
    if (json.code === 200 && json.data.email) {
      document.getElementById('tempmail-address').value = json.data.email
      showToast('临时邮箱已生成')
      let seconds = json.data.expires_in
      const timerEl = document.getElementById('tempmail-timer')
      const countdown = setInterval(() => {
        seconds--
        if (seconds <= 0) {
          clearInterval(countdown)
          timerEl.textContent = '已过期'
          document.getElementById('tempmail-address').value = ''
        } else {
          const m = Math.floor(seconds / 60)
          const s = seconds % 60
          timerEl.textContent = `剩余 ${m}:${s.toString().padStart(2, '0')}`
        }
      }, 1000)
      fetchTempmails(json.data.email)
    } else {
      alert('生成失败：' + json.message)
    }
  } catch (e) {
    alert('请求失败：' + e.message)
  }
}

async function fetchTempmails(email) {
  const listEl = document.getElementById('tempmail-list')
  listEl.innerHTML = '<p style="text-align:center;color:var(--text2)">加载中...</p>'
  try {
    const res = await fetch(`https://api.tinyapi.to/p/v1/tempmail/mails?email=${encodeURIComponent(email)}`, {
      headers: { 'Authorization': `Bearer ${TINYAPI_KEY}` }
    })
    const json = await res.json()
    if (json.code === 200 && json.data) {
      const mails = json.data.mails || []
      if (mails.length === 0) {
        listEl.innerHTML = '<p style="text-align:center;color:var(--text2)">暂无邮件</p>'
      } else {
        listEl.innerHTML = mails.map(m => `
          <div style="padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="alert('发件人: ${m.from}\\n\\n${m.body}')">
            <div style="font-weight:500">${m.subject}</div>

      }

  } catch (e) {
    listEl.innerHTML = '<p style="text-align:center;color:#e74c3c">加载失败</p>'
  }
}

async function loadShare(code) {
  const shareFileItem = document.getElementById('share-file-item')
  const loginSaveBtn = document.getElementById('login-save-btn')
  const infoCard = document.getElementById('share-info-card')
  const { data: links, error } = await supabase.from('share_links').select('*, files(*)').eq('code', code).maybeSingle()
  if (error || !links) {
    shareFileItem.style.display = 'none'; loginSaveBtn.style.display = 'none'
    infoCard.innerHTML = '<div style="color:#e74c3c;text-align:center;width:100%">分享不存在或已失效</div>'
    return
  }
  if (links.expires_at && new Date(links.expires_at) < new Date()) {
    shareFileItem.style.display = 'none'; loginSaveBtn.style.display = 'none'
    infoCard.innerHTML = '<div style="color:#e74c3c;text-align:center;width:100%">分享已过期</div>'
    return
  }
  shareFileData = links.files
  if (!shareFileData) {
    shareFileItem.style.display = 'none'; loginSaveBtn.style.display = 'none'
    infoCard.innerHTML = '<div style="color:#e74c3c;text-align:center;width:100%">文件已被删除，无法下载</div>'
    return
  }
  document.getElementById('share-user-email').textContent = '用户'
  document.getElementById('share-file-name').textContent = shareFileData.name
  document.getElementById('share-file-meta').textContent = formatSize(shareFileData.size)
  document.getElementById('share-file-icon').innerHTML = getFileIconHTML(shareFileData.type)
  shareFileItem.style.display = 'flex'; loginSaveBtn.style.display = 'flex'
  loginSaveBtn.onclick = () => {
    if (currentUser) saveFileToMyAccount()
    else {
      document.getElementById('auth-page').style.display = 'block'
      isLogin = true
      document.getElementById('auth-title').textContent = '登录'
      document.getElementById('auth-sub').textContent = '登录后保存文件'
      document.getElementById('auth-btn').textContent = '登录并保存'
      document.getElementById('toggle-text').textContent = '没有账号？'
      document.getElementById('toggle-link').textContent = '注册'
    }
  }
}

async function saveFileToMyAccount() {
  if (!shareFileData || !currentUser) return
  showToast('正在保存...')
  try {
    const { data: urlData, error: urlError } = await supabase.storage.from('user-files').createSignedUrl(shareFileData.storage_path, 60)
    if (urlError || !urlData?.signedUrl) throw new Error('无法获取源文件链接')
    const res = await fetch(urlData.signedUrl)
    if (!res.ok) throw new Error('下载源文件失败')
    const blob = await res.blob()
    const newPath = `${currentUser.id}/${Date.now()}_${shareFileData.name}`
    const { error: uploadError } = await supabase.storage.from('user-files').upload(newPath, blob, { contentType: blob.type || 'application/octet-stream' })
    if (uploadError) throw uploadError
    await supabase.from('files').insert({ user_id: currentUser.id, name: shareFileData.name, size: blob.size, type: blob.type, storage_path: newPath, source: 'save' })
    showToast('文件已保存到你的网盘')
  } catch (err) { showToast('保存失败：' + err.message) }
}

}

function updateMeStorage() {
  const totalSize = allFiles.reduce((sum, f) => sum + (f.size || 0), 0)
  const usedEl = document.getElementById('used-size')
  const fillEl = document.getElementById('progress-fill')
  if (usedEl) usedEl.textContent = formatSize(totalSize)
  if (fillEl) fillEl.style.width = Math.min((totalSize / (1024*1024*1024)) * 100, 100) + '%'
}

async function loadShareHistory() {
  const { data } = await supabase.from('share_links').select('files(name), code, created_at').eq('creator_id', currentUser?.id).order('created_at', { ascending: false })
  const container = document.getElementById('share-history-list')
  if (!container) return
  container.innerHTML = (!data || data.length === 0) ? '<div style="padding:24px;text-align:center;color:var(--text2)">暂无分享记录</div>' : data.map(s => `<div class="file-row"><div class="file-info"><div class="file-name">${s.files?.name||'未知'}</div><div class="file-meta">提取码: ${s.code} · ${new Date(s.created_at).toLocaleDateString()}</div></div></div>`).join('')
}

window.toggleTheme = () => {
  document.body.classList.toggle('dark')
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light')
  const el = document.getElementById('theme-status')
  if (el) el.textContent = document.body.classList.contains('dark') ? '开启' : '关闭'
}

document.getElementById('close-upload-panel').addEventListener('click', () => { document.getElementById('upload-panel').classList.remove('open'); document.getElementById('overlay').classList.remove('show') })
document.getElementById('overlay').addEventListener('click', () => { document.getElementById('upload-panel').classList.remove('open'); document.getElementById('overlay').classList.remove('show') })

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark')
</script>
</body>
