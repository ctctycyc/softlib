<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简网盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 520px; }
  .hidden { display: none !important; }
  h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.2rem; color: #1a1a1a; }
  .sub { color: #6b7280; margin-bottom: 1.5rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; transition: 0.2s; }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .btn { width: 100%; padding: 0.8rem; background: #3b82f6; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 0.2rem; }
  .btn:hover { background: #2563eb; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; border-radius: 8px; }
  .toggle { margin-top: 1rem; text-align: center; color: #6b7280; font-size: 0.85rem; }
  .toggle a { color: #3b82f6; cursor: pointer; text-decoration: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .top-bar span { font-size: 0.9rem; color: #4b5563; }
  .file-list { margin-top: 1rem; }
  .file-item { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
  .file-item:last-child { border-bottom: none; }
  .file-info { display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 0; }
  .file-icon { display: inline-flex; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem; flex-shrink: 0; }
  .file-icon svg { width: 1.3rem; height: 1.3rem; }
  .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .file-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .upload-area { margin: 1rem 0; }
  #uploadInput { display: none; }
  .copied-tip { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 0.5rem 1.2rem; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
  .copied-tip.show { opacity: 1; }
  .error { color: #ef4444; margin-top: 1rem; text-align: center; }
</style>
</head>
<body>

<div class="card hidden" id="share-section">
  <h2>你收到了一个文件</h2>
  <div id="file-info"></div>
  <div id="error-msg" class="error"></div>
</div>

<div class="card hidden" id="auth-section">
  <h2 id="auth-title">登录</h2>
  <p class="sub" id="auth-sub">欢迎回来</p>
  <input type="email" id="email" placeholder="邮箱" autocomplete="email">
  <input type="password" id="password" placeholder="密码">
  <button class="btn" id="auth-btn">登录</button>
  <div class="toggle"><span id="toggle-text">没有账号？</span> <a id="toggle-link">注册</a></div>
</div>

<div class="card hidden" id="app-section">
  <div class="top-bar">
    <span id="user-email"></span>
    <button class="btn btn-sm" id="logout-btn">退出</button>
  </div>
  <h2>我的文件</h2>
  <div class="upload-area">
    <button class="btn" id="upload-btn">+ 上传文件</button>
    <input type="file" id="uploadInput" multiple>
  </div>
  <div class="file-list" id="file-list"></div>
</div>

<div class="copied-tip" id="copied-tip">链接已复制</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

// ⚠️ 将下面的两个值替换成你自己的 Supabase URL 和 anon key
const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_ANON_KEY')

const shareSection = document.getElementById('share-section')
const authSection = document.getElementById('auth-section')
const appSection = document.getElementById('app-section')
const authTitle = document.getElementById('auth-title')
const authSub = document.getElementById('auth-sub')
const authBtn = document.getElementById('auth-btn')
const toggleText = document.getElementById('toggle-text')
const toggleLink = document.getElementById('toggle-link')
const email = document.getElementById('email')
const password = document.getElementById('password')
const userEmailSpan = document.getElementById('user-email')
const fileListDiv = document.getElementById('file-list')
const uploadBtn = document.getElementById('upload-btn')
const uploadInput = document.getElementById('uploadInput')
const copiedTip = document.getElementById('copied-tip')
const fileInfoDiv = document.getElementById('file-info')
const errorDiv = document.getElementById('error-msg')

let isLogin = true

const params = new URLSearchParams(location.search)
const shareCode = params.get('code')

if (shareCode) {
  shareSection.classList.remove('hidden')
  loadShare(shareCode)
} else {
  checkAuth()
}

toggleLink.addEventListener('click', () => {
  isLogin = !isLogin
  authTitle.textContent = isLogin ? '登录' : '注册'
  authSub.textContent = isLogin ? '欢迎回来' : '创建新账号'
  authBtn.textContent = isLogin ? '登录' : '注册'
  toggleText.textContent = isLogin ? '没有账号？' : '已有账号？'
  toggleLink.textContent = isLogin ? '注册' : '登录'
})

authBtn.addEventListener('click', async () => {
  const mail = email.value.trim(), pwd = password.value
  if (!mail || !pwd) return alert('请填写邮箱和密码')
  const { error } = isLogin
    ? await supabase.auth.signInWithPassword({ email: mail, password: pwd })
    : await supabase.auth.signUp({ email: mail, password: pwd })
  if (error) return alert(error.message)
  if (!isLogin) alert('注册成功，已自动登录')
  checkAuth()
})

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut()
  checkAuth()
})

uploadBtn.addEventListener('click', () => uploadInput.click())
uploadInput.addEventListener('change', async (e) => {
  const files = e.target.files
  for (const file of files) {
    await uploadFile(file)
  }
  uploadInput.value = ''
})

async function uploadFile(file) {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user) return
  const path = `${user.id}/${Date.now()}_${file.name}`
  const { error } = await supabase.storage.from('user-files').upload(path, file)
  if (error) return alert('上传失败：' + error.message)
  await supabase.from('files').insert({
    user_id: user.id,
    name: file.name,
    size: file.size,
    type: file.type,
    storage_path: path
  })
  loadFiles()
}

async function loadFiles() {
  const { data } = await supabase.from('files').select('*').order('created_at', { ascending: false })
  if (!data) return
  fileListDiv.innerHTML = data.map(f => `
    <div class="file-item">
      <div class="file-info">
        <span class="file-icon">${getFileIcon(f.type)}</span>
        <span class="file-name" title="${f.name}">${f.name}</span>
        <span style="color:#9ca3af;font-size:0.8rem;">${formatSize(f.size)}</span>
      </div>
      <div class="file-actions">
        <button class="btn btn-sm" data-action="download" data-id="${f.id}" data-path="${f.storage_path}">下载</button>
        <button class="btn btn-sm" data-action="share" data-id="${f.id}">分享</button>
        <button class="btn btn-sm" data-action="delete" data-id="${f.id}" data-path="${f.storage_path}">删除</button>
      </div>
    </div>
  `).join('')
  document.querySelectorAll('[data-action="download"]').forEach(btn => {
    btn.onclick = () => downloadFile(btn.dataset.path)
  })
  document.querySelectorAll('[data-action="share"]').forEach(btn => {
    btn.onclick = () => createShare(btn.dataset.id)
  })
  document.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.onclick = () => deleteFile(btn.dataset.id, btn.dataset.path)
  })
}

async function downloadFile(path) {
  const { data } = await supabase.storage.from('user-files').createSignedUrl(path, 60)
  if (data?.signedUrl) window.open(data.signedUrl, '_blank')
}

async function deleteFile(id, path) {
  await supabase.from('files').delete().eq('id', id)
  await supabase.storage.from('user-files').remove([path])
  loadFiles()
}

// ⭐ 分享函数：使用 suo.im 生成短链接（国内可用）
async function createShare(fileId) {
  const code = Math.random().toString(36).substring(2, 8).toUpperCase()
  const { error } = await supabase.from('share_links').insert({
    file_id: fileId,
    creator_id: (await supabase.auth.getUser()).data.user.id,
    code,
    expires_at: new Date(Date.now() + 7*24*60*60*1000)
  })
  if (error) {
    alert('分享失败：' + error.message)
    return
  }
  const longLink = `${location.origin}${location.pathname}?code=${code}`
  
  try {
    const res = await fetch(`https://suo.im/api.htm?format=simple&url=${encodeURIComponent(longLink)}`)
    const shortLink = await res.text()
    if (shortLink.startsWith('http')) {
      try {
        await navigator.clipboard.writeText(shortLink)
        copiedTip.classList.add('show')
        setTimeout(() => copiedTip.classList.remove('show'), 2000)
      } catch (e) {
        alert('分享链接已生成，请复制：\n' + shortLink)
      }
    } else {
      throw new Error('短链接生成失败')
    }
  } catch (e) {
    // 回退到原始长链接
    alert('短链接生成失败，原始链接：\n' + longLink)
  }
}

async function loadShare(code) {
  const { data: links, error } = await supabase
    .from('share_links')
    .select('*, files(*)')
    .eq('code', code)
    .maybeSingle()

  if (error || !links) {
    errorDiv.textContent = '分享不存在或已失效'
    return
  }
  if (links.expires_at && new Date(links.expires_at) < new Date()) {
    errorDiv.textContent = '分享已过期'
    return
  }
  const file = links.files
  fileInfoDiv.innerHTML = `
    <div style="font-size:1.1rem; margin:1rem 0; color:#374151;">${file.name}</div>
    <div style="color:#6b7280; font-size:0.9rem; margin-bottom:1.2rem;">${formatSize(file.size)}</div>
    <button class="btn" id="download-btn">下载文件</button>
  `
  document.getElementById('download-btn').onclick = async () => {
    const { data } = await supabase.storage
      .from('user-files')
      .createSignedUrl(file.storage_path, 60)
    if (data?.signedUrl) window.open(data.signedUrl, '_blank')
    else alert('无法获取下载链接')
  }
}

function getFileIcon(type) {
  const svgImage = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
  const svgVideo = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  const svgPdf = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/></svg>'
  const svgArchive = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><polyline points="11 12 11 2 13 2 13 12"/><line x1="7" y1="6" x2="17" y2="6"/></svg>'
  if (!type) return '📁'
  if (type.startsWith('image/')) return svgImage
  if (type.startsWith('video/')) return svgVideo
  if (type.includes('pdf')) return svgPdf
  if (type.includes('zip') || type.includes('rar') || type.includes('7z') || type.includes('tar') || type.includes('gz')) return svgArchive
  return '📁'
}

function formatSize(bytes) {
  if (!bytes) return '0 B'
  const k = 1024, sizes = ['B','KB','MB','GB']
  const i = Math.floor(Math.log(bytes) / Math.log(k))
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]
}

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession()
  if (session) {
    authSection.classList.add('hidden')
    appSection.classList.remove('hidden')
    shareSection.classList.add('hidden')
    userEmailSpan.textContent = session.user.email
    loadFiles()
  } else {
    authSection.classList.remove('hidden')
    appSection.classList.add('hidden')
    shareSection.classList.add('hidden')
  }
}
</script>
</body>
</html>
